<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>INARO — 🫧 Where Feelings Find Comfort</title>
  <meta name="description" content="A privacy-first mental well-being companion for emotional venting, AI conversations, and real-time mood-responsive care." />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%237C3AED'><path d='M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z'/></svg>" />

  <!-- Fonts: Outfit (Display) & Plus Jakarta Sans (Body) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
            display: ['"Outfit"', 'system-ui', 'sans-serif'],
          },
          animation: {
            'pop-in': 'popIn 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards',
            'float': 'float 7s ease-in-out infinite',
            'twinkle': 'twinkle 3s ease-in-out infinite',
            'fade-up': 'fadeUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards',
          },
          keyframes: {
            popIn: {
              '0%': { opacity: '0', transform: 'scale(0.2) perspective(600px) rotateX(15deg) translateY(40px)' },
              '70%': { transform: 'scale(1.12) perspective(600px) rotateX(-5deg) translateY(-8px)' },
              '100%': { opacity: '1', transform: 'scale(1) perspective(600px) rotateX(0deg) translateY(0)' },
            },
            float: {
              '0%, 100%': { transform: 'translateY(0px)' },
              '50%': { transform: 'translateY(-14px)' },
            },
            twinkle: {
              '0%, 100%': { opacity: '0.3', transform: 'scale(0.85) rotate(0deg)' },
              '50%': { opacity: '1', transform: 'scale(1.25) rotate(45deg)' },
            },
            fadeUp: {
              '0%': { opacity: '0', transform: 'translateY(20px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' },
            }
          }
        }
      }
    }
  </script>

  <style>
    /* Astra GPT-6 glassmorphic styling infused with delicate purple glow */
    .astra-master-card {
      background: rgba(255, 255, 255, 0.82);
      backdrop-filter: blur(32px);
      -webkit-backdrop-filter: blur(32px);
      border: 1px solid rgba(255, 255, 255, 0.95);
      box-shadow: 0 30px 90px -20px rgba(124, 58, 237, 0.22), 0 0 0 1px rgba(255, 255, 255, 0.8) inset;
    }
    .gradient-hero-title {
      background: linear-gradient(135deg, #3B82F6 0%, #6366F1 50%, #7C3AED 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .btn-next-glow {
      background: linear-gradient(135deg, #3B82F6 0%, #6D28D9 50%, #7C3AED 100%);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .btn-next-glow:hover {
      background: linear-gradient(135deg, #2563EB 0%, #5B21B6 50%, #6D28D9 100%);
      box-shadow: 0 16px 50px -5px rgba(59, 130, 246, 0.6), 0 0 35px rgba(139, 92, 246, 0.55);
      transform: translateY(-2px);
    }
    .btn-next-glow:active {
      transform: scale(0.97);
    }
  </style>

  <!-- React & Babel for zero-build immediate browser rendering -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-gradient-to-br from-[#EDE9FE] via-[#F5F3FF] to-[#EFF6FF] text-slate-900 font-sans antialiased min-h-screen overflow-x-hidden selection:bg-purple-200 selection:text-purple-900 flex items-center justify-center p-4 sm:p-8">

  <div id="root" class="w-full flex items-center justify-center"></div>

  <script type="text/babel">
    const { useState } = React;

    function FloatingStarField() {
      const stars = [
        { top: '10%', left: '12%', size: 16, delay: '0s', dur: '3.5s', color: '#A855F7' },
        { top: '18%', right: '14%', size: 22, delay: '0.7s', dur: '4.2s', color: '#8B5CF6' },
        { top: '35%', left: '6%', size: 14, delay: '1.2s', dur: '3.1s', color: '#38BDF8' },
        { top: '65%', right: '8%', size: 18, delay: '0.4s', dur: '3.8s', color: '#C084FC' },
        { top: '78%', left: '14%', size: 15, delay: '1.8s', dur: '3.3s', color: '#7C3AED' },
        { top: '82%', right: '16%', size: 20, delay: '1s', dur: '4.5s', color: '#60A5FA' },
        { top: '24%', left: '22%', size: 12, delay: '2.1s', dur: '2.9s', color: '#9333EA' },
        { top: '26%', right: '25%', size: 14, delay: '0.9s', dur: '3.6s', color: '#3B82F6' },
      ];

      return (
        <div className="absolute inset-0 pointer-events-none overflow-hidden z-0" aria-hidden="true">
          {stars.map((s, idx) => (
            <svg
              key={idx}
              viewBox="0 0 24 24"
              className="absolute animate-pulse"
              style={{
                top: s.top,
                left: s.left,
                right: s.right,
                width: `${s.size}px`,
                height: `${s.size}px`,
                animationDelay: s.delay,
                animationDuration: s.dur,
                filter: `drop-shadow(0 0 10px ${s.color})`,
              }}
            >
              <path
                d="M12 0L14.59 9.41L24 12L14.59 14.59L12 24L9.41 14.59L0 12L9.41 9.41L12 0Z"
                fill={s.color}
              />
            </svg>
          ))}
        </div>
      );
    }

    function LetterSparkleBurst() {
      const sparkles = [
        { top: '-24px', left: '-12px', size: 28, color: '#38BDF8', delay: '0.05s' },
        { top: '-28px', right: '20%', size: 32, color: '#A855F7', delay: '0.2s' },
        { bottom: '-20px', left: '24%', size: 24, color: '#818CF8', delay: '0.35s' },
        { top: '-16px', right: '-12px', size: 30, color: '#C084FC', delay: '0.15s' },
        { bottom: '-22px', right: '18%', size: 26, color: '#7C3AED', delay: '0.3s' },
        { top: '35%', left: '-20px', size: 20, color: '#3B82F6', delay: '0.45s' },
        { top: '35%', right: '-20px', size: 22, color: '#9333EA', delay: '0.4s' },
      ];

      return (
        <div className="absolute inset-0 pointer-events-none z-10" aria-hidden="true">
          {sparkles.map((sp, i) => (
            <svg
              key={i}
              viewBox="0 0 24 24"
              className="absolute animate-bounce"
              style={{
                top: sp.top,
                bottom: sp.bottom,
                left: sp.left,
                right: sp.right,
                width: `${sp.size}px`,
                height: `${sp.size}px`,
                animationDelay: sp.delay,
                animationDuration: '2.5s',
                filter: `drop-shadow(0 0 14px ${sp.color})`,
              }}
            >
              <path
                d="M12 0L14.8 9.2L24 12L14.8 14.8L12 24L9.2 14.8L0 12L9.2 9.2L12 0Z"
                fill={sp.color}
              />
            </svg>
          ))}
        </div>
      );
    }

    function IntroLanding() {
      const [isTransitioning, setIsTransitioning] = useState(false);
      const [hoveredCard, setHoveredCard] = useState(null);

      const featureColumns = [
        {
          id: 1,
          icon: '✨',
          title: 'Dump Mode',
          badge: 'Unfiltered',
          description: 'Pure unfiltered private venting with zero AI counter-advice or judgment.',
          borderAccent: 'hover:border-purple-400',
          glowAccent: 'hover:shadow-purple-500/20',
          iconBg: 'bg-purple-100 text-purple-700',
        },
        {
          id: 2,
          icon: '🤖',
          title: 'Interactive Mode',
          badge: 'Dual Voice',
          description: 'Customizable AI companions with dual STT/TTS voice intelligence and Tamil support.',
          borderAccent: 'hover:border-blue-400',
          glowAccent: 'hover:shadow-blue-500/20',
          iconBg: 'bg-blue-100 text-blue-700',
        },
        {
          id: 3,
          icon: '🎭',
          title: 'Mood Avatar',
          badge: 'Real-Time',
          description: 'Real-time dynamic expression avatar synced with live UI theme color shifts.',
          borderAccent: 'hover:border-fuchsia-400',
          glowAccent: 'hover:shadow-fuchsia-500/20',
          iconBg: 'bg-fuchsia-100 text-fuchsia-700',
        },
        {
          id: 4,
          icon: '🛡️',
          title: 'Crisis Safety',
          badge: 'Verified 24/7',
          description: 'Centralized verified helpline directory with 1-click native dialer access.',
          borderAccent: 'hover:border-rose-400',
          glowAccent: 'hover:shadow-rose-500/20',
          iconBg: 'bg-rose-100 text-rose-700',
        },
        {
          id: 5,
          icon: '🔒',
          title: 'Privacy Engine',
          badge: 'Zero-Knowledge',
          description: 'Secure server-side architecture with encrypted OTP and private transcript handling.',
          borderAccent: 'hover:border-indigo-400',
          glowAccent: 'hover:shadow-indigo-500/20',
          iconBg: 'bg-indigo-100 text-indigo-700',
        },
      ];

      const [nextTriggered, setNextTriggered] = useState(false);

      const handleNext = () => {
        setIsTransitioning(true);
        setTimeout(() => {
          setIsTransitioning(false);
          setNextTriggered(true);
          setTimeout(() => setNextTriggered(false), 3500);
        }, 400);
      };

      return (
        <div className={`relative w-full max-w-6xl transition-all duration-500 ${isTransitioning ? 'scale-95 opacity-0' : 'scale-100 opacity-100'}`}>
          {/* Ambient Purple Lights */}
          <div className="absolute -top-32 left-1/2 -translate-x-1/2 w-[700px] h-[550px] rounded-full bg-gradient-to-b from-[#7C3AED]/25 via-[#8B5CF6]/18 to-transparent blur-[140px] pointer-events-none" />
          <div className="absolute top-1/3 -right-32 w-[580px] h-[580px] rounded-full bg-[#A855F7]/20 blur-[130px] pointer-events-none" />
          <div className="absolute -bottom-32 -left-32 w-[580px] h-[580px] rounded-full bg-[#3B82F6]/18 blur-[130px] pointer-events-none" />

          <FloatingStarField />

          {/* Astra GPT-6 Glassmorphic Master Capsule */}
          <main className="relative z-10 w-full astra-master-card rounded-[36px] sm:rounded-[48px] p-6 sm:p-12 flex flex-col items-center text-center">
            
            {/* Top Accent Rim */}
            <div className="absolute top-0 left-1/2 -translate-x-1/2 w-64 h-1.5 bg-gradient-to-r from-transparent via-[#8B5CF6] to-transparent rounded-full blur-[1px]" />

            {/* Prompt 1: Title Pop-Up & Sparkle Entrance */}
            <div className="relative inline-block mt-1 mb-2">
              <LetterSparkleBurst />

              <h1 className="font-display font-black tracking-tight select-none flex items-center justify-center gap-1 sm:gap-3" style={{ perspective: '800px' }}>
                {'INARO'.split('').map((char, index) => (
                  <span
                    key={index}
                    className="inline-block text-7xl sm:text-8xl md:text-9xl font-black gradient-hero-title drop-shadow-[0_15px_35px_rgba(124,58,237,0.32)] animate-pop-in"
                    style={{
                      animationDelay: `${index * 80}ms`,
                      animationFillMode: 'both',
                    }}
                  >
                    {char}
                  </span>
                ))}
              </h1>
            </div>

            {/* Subtitle Badge */}
            <div className="inline-flex items-center gap-2 px-4 py-1.5 rounded-full bg-white/95 border border-purple-200 shadow-[0_4px_16px_rgba(124,58,237,0.12)] backdrop-blur-md mb-4 animate-fade-up">
              <span className="w-2.5 h-2.5 rounded-full bg-gradient-to-r from-[#3B82F6] to-[#7C3AED] animate-ping" />
              <span className="text-xs sm:text-sm font-bold tracking-wide bg-gradient-to-r from-blue-700 to-purple-800 bg-clip-text text-transparent">
                🫧 Where Feelings Find Comfort
              </span>
            </div>

            {/* Tagline */}
            <p className="text-sm sm:text-base text-slate-600 max-w-2xl mx-auto leading-relaxed font-normal mb-8 animate-fade-up" style={{ animationDelay: '200ms', animationFillMode: 'both' }}>
              A privacy-first mental well-being companion for emotional venting, AI conversations, and real-time mood-responsive care.
            </p>

            {/* Prompt 2: Each feature as column next to next */}
            <section aria-label="Core Capabilities" className="w-full my-3 animate-fade-up" style={{ animationDelay: '350ms', animationFillMode: 'both' }}>
              <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-3.5 sm:gap-4 w-full">
                {featureColumns.map((col, idx) => (
                  <div
                    key={col.id}
                    onMouseEnter={() => setHoveredCard(idx)}
                    onMouseLeave={() => setHoveredCard(null)}
                    className={`group relative flex flex-col justify-between p-4 sm:p-5 rounded-3xl bg-white/85 backdrop-blur-xl border border-white/90 shadow-[0_10px_30px_-10px_rgba(124,58,237,0.08)] transition-all duration-300 text-left cursor-default ${
                      col.borderAccent
                    } ${col.glowAccent} ${
                      hoveredCard === idx ? '-translate-y-1.5 shadow-xl bg-white ring-2 ring-purple-300/40' : ''
                    }`}
                  >
                    <div>
                      <div className="flex items-center justify-between mb-3">
                        <span className={`w-10 h-10 rounded-2xl flex items-center justify-center text-lg shadow-sm ${col.iconBg} group-hover:scale-110 transition-transform duration-200`}>
                          {col.icon}
                        </span>
                        <span className="text-[10px] font-bold uppercase tracking-wider text-purple-700 bg-purple-50 border border-purple-200/60 px-2 py-0.5 rounded-full">
                          {col.badge}
                        </span>
                      </div>

                      <h3 className="font-display font-bold text-slate-900 text-sm sm:text-base tracking-tight mb-1.5 group-hover:text-purple-700 transition-colors">
                        {col.title}
                      </h3>

                      <p className="text-xs text-slate-600 leading-relaxed font-normal">
                        {col.description}
                      </p>
                    </div>

                    <div className="mt-4 pt-2.5 border-t border-slate-100/80 flex items-center justify-between text-[11px] font-semibold text-purple-600">
                      <span className="opacity-0 group-hover:opacity-100 transition-opacity duration-200">Active</span>
                      <span className="text-slate-300 group-hover:text-purple-500 transition-colors">✦</span>
                    </div>
                  </div>
                ))}
              </div>
            </section>

            {/* Prompt 3: Astra-Style Next Button */}
            <div className="mt-10 sm:mt-12 w-full flex flex-col items-center justify-center animate-fade-up" style={{ animationDelay: '500ms', animationFillMode: 'both' }}>
              <button
                onClick={handleNext}
                className="btn-next-glow group relative inline-flex items-center justify-center gap-3 px-10 sm:px-14 py-4 sm:py-4.5 rounded-2xl font-display font-bold text-sm sm:text-base text-white shadow-[0_12px_40px_-5px_rgba(109,40,217,0.5),0_0_25px_rgba(124,58,237,0.35)] active:scale-95 transition-all duration-300 overflow-hidden"
                aria-label="Proceed to INARO"
              >
                <div className="absolute inset-0 -translate-x-full group-hover:translate-x-full transition-transform duration-1000 bg-gradient-to-r from-transparent via-white/25 to-transparent pointer-events-none" />

                <span className="tracking-wide text-white drop-shadow-sm">Next</span>

                <span className="inline-block transition-transform duration-300 group-hover:translate-x-2 text-lg">
                  →
                </span>
              </button>

              <div className="mt-6 text-[11px] font-medium text-slate-500 flex items-center gap-2">
                <span className="w-1.5 h-1.5 rounded-full bg-emerald-500" />
                <span>100% Confidential • End-to-End Encrypted • No Setup Required</span>
              </div>
            </div>

            {/* Transition Trigger Callback Notification */}
            {nextTriggered && (
              <div className="fixed bottom-8 left-1/2 -translate-x-1/2 px-6 py-3 rounded-2xl bg-slate-900/90 text-white border border-purple-400/40 shadow-2xl backdrop-blur-xl flex items-center gap-3 animate-fade-up z-50">
                <span className="text-purple-400 font-bold text-base">✦</span>
                <span className="text-xs font-semibold">Transition Callback Triggered — Welcome to INARO!</span>
              </div>
            )}
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<IntroLanding />);
  </script>
</body>
</html>
